<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kosecha · Panel administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-topbar">
      <a class="link-with-icon" href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Ver catálogo público
      </a>
      <div class="admin-topbar__right">
        <span class="save-flag" id="save-flag"></span>
        <span class="badge-panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Panel administrador
        </span>
        <button class="btn btn--ghost" id="logout-btn">Cerrar sesión</button>
      </div>
    </div>

    <section class="admin-card">
      <h2 class="admin-card__title">Información del negocio</h2>
      <div class="business-row">
        <div class="logo-preview" id="logo-preview">
          <span id="logo-fallback">K</span>
          <img id="logo-img" hidden alt="Logo" />
        </div>
        <div class="business-fields">
          <label>Nombre del emprendimiento</label>
          <input id="business-name" type="text" />
          <label>Frase / tagline</label>
          <input id="tagline" type="text" />
          <label>Texto del pie de página</label>
          <input id="footer-note" type="text" />
          <label>Contacto</label>
          <input id="contact" type="text" />
        </div>
        <div class="business-actions">
          <input type="file" id="logo-input" accept="image/*" hidden />
          <button class="btn btn--olive" id="logo-btn" type="button">Subir logo</button>
          <button class="btn btn--forest" id="save-meta-btn" type="button">Guardar datos</button>
        </div>
      </div>
    </section>

    <section class="admin-card">
      <h2 class="admin-card__title">Secciones y productos</h2>
      <div class="new-section-row">
        <input id="new-section-name" type="text" placeholder="Nombre de nueva sección (ej: Lácteos)" />
        <button class="btn btn--forest" id="add-section-btn" type="button">+ Sección</button>
      </div>
      <div id="sections-list" class="sections-list"></div>
    </section>
  </div>

  <template id="tpl-product-form">
    <form class="product-form">
      <div class="product-form__image-row">
        <div class="product-form__image-preview"></div>
        <input type="file" class="pf-image-input" accept="image/*" hidden />
        <button type="button" class="btn btn--olive pf-upload-btn">Subir imagen</button>
      </div>
      <div class="product-form__grid">
        <input type="text" class="pf-name" placeholder="Nombre del producto" required />
        <input type="text" class="pf-weight" placeholder="Peso (ej: 500 g)" />
        <input type="number" min="0" class="pf-price" placeholder="Precio a detalle (CLP)" required />
        <input type="text" class="pf-wholesale-price" placeholder="Precio mayorista (ej: $3.700 desde 5 kg, opcional)" />
      </div>
      <label class="pf-section-label">Sección
        <select class="pf-section"></select>
      </label>
      <div class="pf-variants">
        <div class="pf-variants__header">
          <span>Variantes del producto <small>(ej: formatos 250cc / 500cc, o sabores)</small></span>
          <button type="button" class="btn btn--olive pf-add-variant">+ Agregar variante</button>
        </div>
        <div class="pf-variants-list"></div>
      </div>
      <p class="pf-error" hidden></p>
      <div class="product-form__actions">
        <button type="button" class="btn btn--white pf-cancel">Cancelar</button>
        <button type="submit" class="btn btn--forest">Guardar producto</button>
      </div>
    </form>
  </template>

  <template id="tpl-variant-row">
    <div class="variant-row-form">
      <input type="text" class="vf-label" placeholder="Nombre / formato (ej: 250cc, Dubai)" />
      <input type="number" min="0" class="vf-price" placeholder="Precio a detalle" />
      <input type="text" class="vf-wholesale-price" placeholder="Precio mayorista (ej: $3.700 desde 5 kg, opcional)" />
      <button type="button" class="vf-remove" title="Quitar variante">&times;</button>
    </div>
  </template>

  <script src="assets/js/admin.js"></script>
</body>
</html>

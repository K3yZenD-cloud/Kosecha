<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kosecha · Acceso administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body class="login-body">
  <form class="login-card" id="login-form">
    <div class="login-card__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Panel administrador</h1>
    <p class="login-card__subtitle">Kosecha · acceso restringido</p>

    <label for="username">Usuario</label>
    <input id="username" name="username" type="text" autocomplete="username" required />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <p class="login-card__error" id="error" hidden></p>

    <button type="submit">Ingresar</button>
  </form>

  <script src="assets/js/login.js"></script>
</body>
</html>
